<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wisdom Echo</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #f7f7fb;
      color: #111;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 80px 20px;
      text-align: center;
    }

    h1 {
      font-size: 52px;
      margin-bottom: 10px;
    }

    .slogan {
      font-size: 20px;
      color: #555;
      margin-bottom: 40px;
    }

    .logo {
      margin: 30px auto;
    }

    .logo img {
      max-width: 220px;
      width: 100%;
      height: auto;
      border-radius: 12px;
    }

    .button {
      display: inline-block;
      padding: 14px 28px;
      background: #111;
      color: white;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      margin-top: 30px;
    }

    .button:hover {
      opacity: 0.85;
    }

    .section {
      margin-top: 80px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 14px;
      margin-top: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    footer {
      margin-top: 80px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- TITLE -->
    <h1>Wisdom Echo</h1>

    <!-- SLOGAN -->
    <p class="slogan">Where community wisdom shapes what’s next.</p>

    <!-- LOGO IMAGE SPOT -->
    <div class="logo">
      <!-- Replace "Wisdom Echo Logo.jpg" with your actual filename -->
      <img src="202604-Wisdom Echo Logo-Vector-Best Quality.svg" alt="Wisdom Echo Logo">
    </div>

    <footer>
      © 2026 Wisdom Echo
    </footer>

  </div>

</body>
</html>
