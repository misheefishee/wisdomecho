<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wisdom Echo</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #f7f7fb;
      color: #111;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 80px 20px;
      text-align: center;
    }

    h1 {
      font-size: 52px;
      margin-bottom: 10px;
    }

    .slogan {
      font-size: 20px;
      color: #555;
      margin-bottom: 40px;
    }

    .logo img {
      max-width: 220px;
      width: 100%;
      height: auto;
      border-radius: 14px;
      margin: 20px 0 30px;
    }

    .button {
      display: inline-block;
      padding: 14px 28px;
      background: #111;
      color: white;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.2s ease;
    }

    .button:hover {
      opacity: 0.85;
    }

    .section {
      margin-top: 80px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 14px;
      margin-top: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    /* SOCIAL ICONS */
    .socials {
      margin-top: 50px;
      display: flex;
      justify-content: center;
      gap: 14px;
    }

    .socials a {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: white;
      color: #111;
      text-decoration: none;
      font-size: 18px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
      transition: all 0.2s ease;
    }

    .socials a:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(0,0,0,0.12);
    }

    footer {
      margin-top: 80px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- TITLE -->
    <h1>Wisdom Echo</h1>

    <!-- SLOGAN -->
    <p class="slogan">Where community wisdom shapes what’s next.</p>

    <!-- LOGO -->
    <div class="logo">
      <img src="202604-Wisdom Echo Logo-Vector-Best Quality.svg" alt="Wisdom Echo Logo">
    </div>

    <!-- SOCIAL LINKS -->
    <div class="socials">

      <a href="https://instagram.com/wisdomecho.ca" target="_blank" title="Instagram">
        📸
      </a>

      <a href="https://www.linkedin.com/company/wisdomecho" target="_blank" title="LinkedIn">
        💼
      </a>

    </div>

    <footer>
      © 2026 Wisdom Echo
    </footer>

  </div>

</body>
</html>
